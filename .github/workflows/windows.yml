name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [feature-quiz-dashboard]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn clean package -DskipTests
      - shell: bash
        run: |
          mkdir installer-input
          cp target/cyberlab.jar installer-input/
          jpackage --type exe --name CyberLab --app-version 1.0 \
            --vendor "CyberLab Team" \
            --input installer-input --main-jar cyberlab.jar \
            --main-class com.cyberlab.Launcher \
            --icon packaging/CyberLab.ico \
            --win-shortcut --win-menu --win-dir-chooser \
            --dest installer-output
      - uses: actions/upload-artifact@v4
        with:
          name: CyberLab-Windows
          path: installer-output/*.exe
